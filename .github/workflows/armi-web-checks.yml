name: ARMI Web checks

on:
  push:
    branches: ["main", "web/cloudflare-pilot"]
    paths: ["web/**", ".github/workflows/armi-web-checks.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/armi-web-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:deploy
